<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Ecommerce</title>
  <meta name="description"
    content="SyntaxWear - Tênis e Sneakers Online. Compre os melhores tênis e sneakers com estilo e conforto.">

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">

  <link rel="stylesheet" href="./css/components/header.css">
  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/product-card.css">

</head>

<body>
  <header class="header">

    <h1 class="logo">
      <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
        <img src="./images/logo/Logo.svg" alt="SyntaxWear - Tênis e Sneakers Online">
      </a>
    </h1>

    <div class="nav-container">
      <nav class="nav-center" aria-label="Navegação Principal">
        <ul>
          <li><a href="#">Masculino</a></li>
          <li><a href="#">Feminino</a></li>
          <li><a href="#">Outlet</a></li>
        </ul>
      </nav>

      <nav class="nav-right" aria-label="Navegação Secundária">
        <ul>
          <li><a href="#">Nossas lojas</a></li>
          <li><a href="#">Sobre</a></li>
          <li>
            <a href="#" aria-label="Minha Conta">
              <img src="./images/icons/user.svg" alt="Minha Conta">
            </a>
          </li>
          <li>
            <a href="#" aria-label="Ajuda">
              <img src="./images/icons/help.svg" alt="Ajuda">
            </a>
          </li>
          <li>
            <a href="#" aria-label="Carrinho">
              <img src="./images/icons/bag.svg" alt="Carrinho">
            </a>
          </li>
        </ul>
      </nav>
    </div>


  </header>

  <main>
    <section class="hero-section" aria-labelledby="hero-title">
      <div class="hero-overlay">
        <div class="hero-content">
          <span class="hero-subtitle">Krypton One</span>
          <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
          <div class="hero-buttons">
            <a class="btn btn-outline" href="#">Ver modelos</a>
            <a class="btn btn-filled" href="#">Comprar</a>
          </div>
        </div>
      </div>
    </section>

    <section class="categories-section">

      <div class="category-card casual-category">
        <a class="category-link" href="">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Casual</span>
        </a>
      </div>
      <div class="category-card esporte-category">
        <a class="category-link" href="">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Esporte</span>
        </a>
      </div>
      <div class="category-card moderno-category">
        <a class="category-link" href="">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Moderno</span>
        </a>
      </div>
      <div class="category-card futurista-category">
        <a class="category-link" href="">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Futurista</span>
        </a>
      </div>

    </section>

    <section class="featured-products-section" aria-labelledby="products-title">
      <h2 id="products-title">Featured products</h2>
      <div class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="contact-info">
      <h2>Contact</h2>
    </div>
    <div class="footer-links">
      <h2>Links</h2>
    </div>
  </footer>
</body>

</html>

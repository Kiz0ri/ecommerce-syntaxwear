<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Ecommerce</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">

  <link rel="stylesheet" href="./css/components/header.css">

</head>

<body>
  <header class="header">

    <h1 class="logo">
      <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
        <img src="./images/logo/Logo.svg" alt="SyntaxWear - Tênis e Sneakers Online">
      </a>
    </h1>

    <div class="nav-container">
      <nav class="nav-center" aria-label="Navegação Principal">
        <ul>
          <li><a href="#">Masculino</a></li>
          <li><a href="#">Feminino</a></li>
          <li><a href="#">Outlet</a></li>
        </ul>
      </nav>

      <nav class="nav-right" aria-label="Navegação Secundária">
        <ul>
          <li><a href="#">Nossas lojas</a></li>
          <li><a href="#">Sobre</a></li>
          <li>
            <a href="#" aria-label="Minha Conta">
              <img src="./images/icons/user.svg" alt="Minha Conta">
            </a>
          </li>
          <li>
            <a href="#" aria-label="Ajuda">
              <img src="./images/icons/help.svg" alt="Ajuda">
            </a>
          </li>
          <li>
            <a href="#" aria-label="Carrinho">
              <img src="./images/icons/bag.svg" alt="Carrinho">
            </a>
          </li>
        </ul>
      </nav>
    </div>


  </header>

  <main>
    <section class="hero-section" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">Hero</h1>
      </div>
    </section>

    <section class="categories-section" aria-labelledby="categories-title">
      <h2 id="categories-title">Sneaker categories</h2>
      <div class="category-list"></div>
    </section>

    <section class="featured-products-section" aria-labelledby="products-title">
      <h2 id="products-title">Featured products</h2>
      <div class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="contact-info">
      <h2>Contact</h2>
    </div>
    <div class="footer-links">
      <h2>Links</h2>
    </div>
  </footer>
</body>

</html>

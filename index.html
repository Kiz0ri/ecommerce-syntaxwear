<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Ecommerce</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>

<body>
  <header class="site-header header">
    <a class="brand-logo" href="#">SyntaxWear</a>
    <nav class="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero-section" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">Hero</h1>
      </div>
    </section>

    <section class="categories-section" aria-labelledby="categories-title">
      <h2 id="categories-title">Sneaker categories</h2>
      <div class="category-list"></div>
    </section>

    <section class="featured-products-section" aria-labelledby="products-title">
      <h2 id="products-title">Featured products</h2>
      <div class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="contact-info">
      <h2>Contact</h2>
    </div>
    <div class="footer-links">
      <h2>Links</h2>
    </div>
  </footer>
</body>

</html>
